name: RDL · mandar a chave Pix
# manual: manda por e-mail a chave Pix para quem assinou a vistoria e ainda não pagou (uma vez por reserva), com cópia para a dona
on:
  workflow_dispatch:
jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: |
          URL="${SUPABASE_URL:-https://lbggvjebkhdcybpkxzxs.supabase.co}"
          REF=$(echo "$URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          KEY=$(curl -sS "https://api.supabase.com/v1/projects/$REF/api-keys" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '.[] | select(.name=="service_role") | .api_key')
          [ -n "$KEY" ] || { echo "::error::sem a chave de serviço"; exit 1; }
          echo "::add-mask::$KEY"
          curl -sS -X POST "$URL/functions/v1/avisos" -H "Authorization: Bearer $KEY" -H "apikey: $KEY" -H 'Content-Type: application/json' -d '{"tipo":"rdl-pix"}' | tee out.json
          echo "::notice title=chave Pix::$(cat out.json)"
