name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # testa as ações do dia a dia antes de publicar: se algo quebrar, o site não é atualizado
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:smoke
      - run: npm run build
        env:
          # Settings → Secrets and variables → Actions → Variables
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      # prévia da plataforma (branch "plataforma") em /controle/previa/, no modo exemplo:
      # dados fictícios, não usa a nuvem nem os seus dados. Se falhar, o sistema publica normalmente.
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: plataforma
          path: previa-src
      - run: npm ci && VITE_ARTIFACT=1 npx vite build --outDir ../dist/previa --emptyOutDir
        continue-on-error: true
        working-directory: previa-src
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
