name: Atualizar a prévia da plataforma

# A cada envio no branch "plataforma", pede uma nova publicação do site (feita pelo main).
# O site da Laís continua igual; só a pasta /previa/ muda.
on:
  push:
    branches: [plataforma]

permissions:
  actions: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
