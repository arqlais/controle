name: Publicar no Supabase

# Tudo automático a cada envio no main:
#  - função "avisos" ou "pagamentos" mudou → publica a função;
#  - arquivo supabase/atualizacao-*.sql novo ou mudado → roda no banco (os arquivos de atualização podem rodar mais de uma vez).
# Precisa do segredo SUPABASE_ACCESS_TOKEN (uma vez só). Sem ele, não faz nada.
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/atualizacao-*.sql', 'supabase/login-google.txt']
  workflow_dispatch:
    inputs:
      sql:
        description: 'arquivo .sql da pasta supabase/ para rodar (opcional)'
        required: false
        default: ''

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://lbggvjebkhdcybpkxzxs.supabase.co' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: O que mudou
        id: mudou
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "Sem o segredo SUPABASE_ACCESS_TOKEN: nada publicado."; echo "pular=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "ref=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > changed.txt
          else
            # manual: publica as duas funções e roda o arquivo pedido
            printf 'supabase/functions/avisos/index.ts\nsupabase/functions/pagamentos/index.ts\n' > changed.txt
            [ -n "${{ inputs.sql }}" ] && echo "supabase/$(basename '${{ inputs.sql }}')" >> changed.txt
          fi
          cat changed.txt
      - name: SQL
        if: steps.mudou.outputs.pular != '1'
        run: |
          REF='${{ steps.mudou.outputs.ref }}'
          FAIL=0
          for FILE in $(grep -E '^supabase/[^/]+\.sql$' changed.txt | sort); do
            [ -f "$FILE" ] || continue
            echo "→ rodando $FILE"
            jq -Rs '{query: .}' "$FILE" > body.json
            CODE=$(curl -sS -o out.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data @body.json)
            cat out.json; echo
            if [ "$CODE" -ge 300 ]; then echo "::error title=SQL $FILE ($CODE)::$(head -c 600 out.json | tr '\n' ' ')"; FAIL=1; else echo "::notice title=SQL ok $FILE::$(head -c 900 out.json | tr '\n' ' ')"; fi
          done
          exit $FAIL
      - name: Funções
        if: ${{ always() && steps.mudou.outputs.pular != '1' }}
        run: |
          REF='${{ steps.mudou.outputs.ref }}'
          # páginas públicas e o Asaas chamam estas funções sem login: elas mesmas conferem quem pode o quê
          for FN in avisos pagamentos; do
            if grep -q "^supabase/functions/$FN/" changed.txt; then
              echo "→ publicando $FN"
              if supabase functions deploy "$FN" --project-ref "$REF" --no-verify-jwt > dep.txt 2>&1; then echo "::notice title=função $FN::publicada"; else echo "::error title=função $FN::$(tail -c 600 dep.txt | tr '\n' ' ')"; cat dep.txt; exit 1; fi
            fi
          done
      - name: Entrar com Google
        if: ${{ always() && steps.mudou.outputs.pular != '1' }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ]; then echo "Sem GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET: login com Google não mexido."; exit 0; fi
          REF='${{ steps.mudou.outputs.ref }}'
          jq -n --arg id "$GOOGLE_CLIENT_ID" --arg sec "$GOOGLE_CLIENT_SECRET" '{external_google_enabled: true, external_google_client_id: $id, external_google_secret: $sec, site_url: "https://useplane.com.br", uri_allow_list: "https://useplane.com.br/**,https://www.useplane.com.br/**,https://arqlais.github.io/controle/**"}' > auth.json
          CODE=$(curl -sS -o out.json -w '%{http_code}' -X PATCH "https://api.supabase.com/v1/projects/$REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data @auth.json)
          if [ "$CODE" -lt 300 ]; then echo "::notice title=login com Google::ligado no Supabase"; else echo "::warning title=login com Google ($CODE)::a chave do Supabase não pode mudar o login; ligue o Google direto no Supabase (Authentication → Providers)"; fi
