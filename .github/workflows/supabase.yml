name: Publicar no Supabase

# Publica a função "avisos" sempre que ela muda no main, e roda um arquivo .sql de supabase/ quando pedido.
# Precisa do segredo SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions → Secrets).
# Sem ele, não faz nada (o site continua publicando normalmente pelo outro fluxo).
on:
  push:
    branches: [main]
    paths: ['supabase/functions/avisos/**']
  workflow_dispatch:
    inputs:
      sql:
        description: 'arquivo .sql da pasta supabase/ para rodar (opcional, ex.: atualizacao-2026-10-20.sql)'
        required: false
        default: ''

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Função avisos
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "Sem o segredo SUPABASE_ACCESS_TOKEN: nada publicado."; exit 0; fi
          REF=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          # páginas públicas (sem login) chamam esta função: ela mesma confere quem pode o quê
          supabase functions deploy avisos --project-ref "$REF" --no-verify-jwt
      - name: SQL pedido
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sql != '' }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "Sem o segredo SUPABASE_ACCESS_TOKEN."; exit 1; fi
          FILE="supabase/$(basename '${{ inputs.sql }}')"
          [ -f "$FILE" ] || { echo "Arquivo $FILE não existe."; exit 1; }
          REF=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          jq -Rs '{query: .}' "$FILE" > body.json
          CODE=$(curl -sS -o out.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data @body.json)
          cat out.json; echo
          [ "$CODE" -lt 300 ] || { echo "Falhou ($CODE)"; exit 1; }
